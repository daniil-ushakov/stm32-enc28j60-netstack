name: Проверка сетевого стека
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Компиляция и проверка ARP, ICMP, UDP
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I. ethernet.c arp.c ip.c icmp.c udp.c net.c tests/test_stack.c -o /tmp/netstack-test
          /tmp/netstack-test
